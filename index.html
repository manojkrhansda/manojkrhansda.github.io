<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manoj File Library</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050b12;
        color: #d7e2ec;
        font-family: Consolas, monospace;
    }

    header {
        background: #08131f;
        border-bottom: 1px solid #183047;
        padding: 18px 25px;
    }

    .logo {
        color: #00ff9d;
        font-size: 20px;
        font-weight: bold;
    }

    .sub {
        color: #71869a;
        font-size: 12px;
        margin-top: 5px;
    }

    .terminal {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 15px;
    }

    .path {
        color: #00ff9d;
        margin-bottom: 15px;
    }

    .box {
        background: #09131e;
        border: 1px solid #1b3043;
        border-radius: 5px;
        overflow: hidden;
    }

    .file {
        display: flex;
        align-items: center;
        padding: 13px 15px;
        border-bottom: 1px solid #152536;
    }

    .file:last-child {
        border-bottom: none;
    }

    .file:hover {
        background: #0d1d2b;
    }

    .icon {
        width: 40px;
        font-size: 20px;
    }

    .filename {
        flex: 1;
        font-size: 14px;
    }

    .download {
        color: #00ff9d;
        border: 1px solid #00a866;
        padding: 6px 12px;
        border-radius: 3px;
        text-decoration: none;
        font-size: 12px;
    }

    .download:hover {
        background: #00ff9d;
        color: #04100b;
    }

    footer {
        text-align: center;
        color: #53687a;
        font-size: 11px;
        margin: 30px;
    }
</style>
</head>

<body>

<header>
    <div class="logo">MANOJ://FILE_LIBRARY</div>
    <div class="sub">Personal File Repository</div>
</header>

<div class="terminal">

    <div class="path">
        manoj@library:~/files$
    </div>

    <div class="box">

        <div class="file">
            <div class="icon">📦</div>
            <div class="filename">isis.zip</div>
            <a class="download" href="isis.zip" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">📦</div>
            <div class="filename">dbase.zip</div>
            <a class="download" href="dbase.zip" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">🌐</div>
            <div class="filename">index2.html</div>
            <a class="download" href="index2.html" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">🌐</div>
            <div class="filename">new.html</div>
            <a class="download" href="new.html" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">⚙️</div>
            <div class="filename">dimark.bat</div>
            <a class="download" href="dimark.bat" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">🌐</div>
            <div class="filename">books.html</div>
            <a class="download" href="books.html" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">🖼️</div>
            <div class="filename">library.jpg</div>
            <a class="download" href="library.jpg" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">📊</div>
            <div class="filename">List.xlsx</div>
            <a class="download" href="List.xlsx" download>DOWNLOAD</a>
        </div>

        <div class="file">
            <div class="icon">📄</div>
            <div class="filename">Mail Merge.docx</div>
            <a class="download" href="Mail%20Merge.docx" download>DOWNLOAD</a>
        </div>

    </div>

</div>

<footer>
    Created by Manoj Kumar Hansda
</footer>

</body>
</html>
